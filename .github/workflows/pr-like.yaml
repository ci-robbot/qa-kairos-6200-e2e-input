name: pr-like
on: [push]
permissions: { contents: read }
jobs:
  auroraboot-tests:
    uses: ./.github/workflows/_auroraboot-tests.yaml
    permissions: { contents: read }
    with:
      image_artifact: auroraboot-image-amd64
      e2e: false
  pr-gate:
    needs: [auroraboot-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo "result=${{ needs.auroraboot-tests.result }}"; test "${{ needs.auroraboot-tests.result }}" = success
